<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.summary | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/' | relative_url }}">Beiträge</a>
      <a href="{{ '/methodik/' | relative_url }}">Methodik</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site-footer">
    <p>Die Beiträge werden mit KI-Unterstützung recherchiert und vor der Veröffentlichung redaktionell freigegeben. Siehe <a href="{{ '/methodik/' | relative_url }}">Methodik</a>.</p>
  </footer>
</body>
</html>
