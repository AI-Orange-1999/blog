---
layout: default
---
<article class="post">
  <p class="meta">{{ page.date | date: "%d.%m.%Y" }}{% if page.tags and page.tags.size > 0 %} · {{ page.tags | join: ", " }}{% endif %}</p>
  <h1>{{ page.title }}</h1>
  {% if page.summary %}<p class="lead">{{ page.summary }}</p>{% endif %}
  {{ content }}
</article>
